<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SGA - Cadastro</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="auth">
    <aside class="auth-lateral">
      <div>
        <h1>SGA</h1>
        <p class="sub">Sistema de Gestão<br>Acadêmica · Área do Docente</p>
      </div>
      <p class="frase">Crie sua conta de professor para começar a lançar notas.</p>
      <span class="bola b1"></span><span class="bola b3"></span>
    </aside>

    <section class="auth-conteudo">
      <form class="auth-cartao" id="form-cadastro" novalidate>
        <h2>Criar conta de professor</h2>
        <p class="descricao">Preencha os dados abaixo para se cadastrar</p>

        <div id="aviso"></div>

        <div class="campo">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" placeholder="Ana Paula Menezes" autocomplete="name">
          <div class="erro"></div>
        </div>
        <div class="campo">
          <label for="email">E-mail institucional</label>
          <input type="email" id="email" placeholder="professor@maisunifacisa.com.br" autocomplete="email">
          <div class="erro"></div>
        </div>
        <div class="campo">
          <label for="disciplina">Disciplina principal</label>
          <input type="text" id="disciplina" placeholder="Engenharia de Software">
          <div class="erro"></div>
        </div>
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Mínimo de 6 caracteres" autocomplete="new-password">
          <div class="erro"></div>
        </div>
        <div class="campo">
          <label for="confirmar">Confirmar senha</label>
          <input type="password" id="confirmar" placeholder="Repita a senha" autocomplete="new-password">
          <div class="erro"></div>
        </div>

        <button class="btn btn-bloco" type="submit">Cadastrar</button>

        <div class="auth-rodape">
          Já tem uma conta?
          <a href="index.html">Voltar para o login</a>
        </div>
      </form>
    </section>
  </main>

  <script src="js/calculo.js"></script>
  <script src="js/dados.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
